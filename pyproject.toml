[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prompt-toolkit"
version = "67.21.0"
description = "AI提示词体系工具链：条件编译、安全扫描、A/B测试、Prompt Linter"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ab_test = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
]
lsp = [
    "pygls>=1.0",
    "lsprotocol>=2023.0",
]
full = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
prompt-cli = "ai_prompt_toolkit.cli_core:main"
prompt = "ai_prompt_toolkit.cli_core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_prompt_toolkit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["ai_prompt_toolkit"]
omit = ["tests/*", "*/__pycache__/*", "*/playground/*"]
branch = true

[tool.coverage.report]
# R176基线: 68.49%(此前从未真实达标, CI曾虚标80); 目标R177+提升至70+
fail_under = 68
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC",
    "RUF", "PERF", "PIE", "PYI", "Q",
]
# E501: 行长由ruff format管; SIM108/RUF012: 与既有代码风格冲突
# RUF001/002/003: 全角标点为中文项目正常写作, 非缺陷
# PERF401/PERF203/PERF102: 性能微优化让位于可读性; 循环内try/except是逐项错误隔离的既定模式
# RUF015: 自动修复改变异常语义(IndexError→StopIteration), 需逐点决策
# SIM105/SIM102: 风格等价改写; B905: zip(strict=)需逐点语义决策
# N806/E741/A001/A002: 命名与领域惯例(CLI参数名/大写别名)冲突
ignore = [
    "E501", "SIM108", "RUF012", "RUF001", "RUF002", "RUF003",
    "PERF401", "PERF203", "PERF102", "RUF015", "SIM105", "SIM102",
    "B905", "N806", "E741", "A001", "A002",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的 F401 是合法re-export模式(受__all__约束)
"**/__init__.py" = ["F401"]
# 测试中的未用变量多为fixture占位/断言构造
"tests/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["ai_prompt_toolkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
