[build-system]
# R222-C2: 移除 "wheel" — PyPA 已弃用该发行版(部分镜像源下架), PEP 517
# 隔离构建环境装不上 wheel 导致干净环境构建失败; setuptools>=70.1 自带
# bdist_wheel, 无需独立 wheel 包
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prompt-toolkit"
version = "67.34.50"
description = "AI提示词体系工具链：条件编译、安全扫描、A/B测试、Prompt Linter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Guowenchao", email = "gwc0218@qq.com"}]
keywords = ["prompt", "llm", "prompt-engineering", "linter", "security", "ci-gate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # PEP 639: license 表达式(license = "MIT")已取代 License classifier
    # (新版 setuptools 二者并存直接报错), 不写 License :: 行
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]
dependencies = [
    # R225-P0-05: 全部加上下界 — 上界是保险丝, 上游破坏性大版本时
    # CI先红(环境快照断言)而非静默漂移(R223 click 8.5.0类型漂移教训)
    "click>=8.1,<9",
    "rich>=13.0,<16",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.17,<5",
    "cachetools>=5.3,<8",
    # eval matrix HTML完整渲染器(eval matrix命令核心功能) —
    # 此前未声明, CI无jinja2时静默降级丢feedback(R223 CI实证)
    "jinja2>=3.0,<4",
    # config._load_toml 的 Python 3.10 TOML 回退(3.11+ 用标准库 tomllib) —
    # R225 check_dep_manifest 检出: 3.10 环境缺 tomli 时配置静默返回{}
    "tomli>=2.0,<3; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    # 版本钉死: CI与本地同一版本 — R223实证ruff 0.15.14/0.16.10存在
    # format漂移(check/format行为随版本变), 门禁必须可复现不随上游发版抖动
    "ruff==0.16.10",
    "mypy==2.1.0",
    "pre-commit>=3.7",
    # market REST API 测试(test_market_api)顶层 import fastapi,
    # TestClient 依赖 httpx — 此前只在 [full], [dev] 缺失致 CI 收集报错
    "fastapi>=0.100",
    "httpx>=0.24",
    # P3-05 ReDoS 审计(dev 工具链, 绝不进 core 运行时) — 版本钉死保门禁可复现
    "redoctor==0.1.5",
    # P3-02 属性测试(lint 核心性质锁死: waiver 幂等/severity 单调/SARIF 不变量/
    # baseline 对称/复现性) — dev 工具链, 不进 core 运行时
    "hypothesis>=6.82",
]
ab_test = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
]
lsp = [
    "pygls>=1.0",
    "lsprotocol>=2023.0",
]
full = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
prompt-cli = "ai_prompt_toolkit.cli_core:main"
prompt = "ai_prompt_toolkit.cli_core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# R222-C2 审计: templates/*.md 被 template_commands.py 运行时从包内读取
# (Path(__file__).parent.parent / "templates"), playground/static/index.html
# 被 playground/server.py 运行时加载 — 原 package-data 只含 data/*.json,
# pip 安装后(非仓库内运行)模板安装/playground 功能必坏。补齐运行时资产。
# R224-P0-1: 双基线自证数据移入包内作单一真源(原tests/fixtures, 原位置留符号链接)
# — pip用户 prompt-cli baseline 需包内自带样本才能自证漏检/误报基线
# R249-P2-25: 过防御外部基准(NotInject)同纪律进包 — pip用户可自证过防御面
ai_prompt_toolkit = [
    "data/*.json",
    "data/clean_prompts/*.md",
    "data/clean_prompts/*.txt",
    "data/external_bench/*.json",
    "data/external_bench/*.md",
    "templates/*.md",
    "playground/static/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "slow: 慢面测试(跑一次双基线等, CI 默认 -k 'not slow' 排除, 显式跑: pytest -m slow)",
]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["ai_prompt_toolkit"]
omit = ["tests/*", "*/__pycache__/*", "*/playground/*"]
branch = true

[tool.coverage.report]
# R216: 实测75.67%, 70+目标达成 → 棘轮锁定75(机械锁收益, 不刷数);
# R176基线: 68.49%(此前从未真实达标, CI曾虚标80)
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TC",
    "RUF", "PERF", "PIE", "PYI", "Q",
]
# E501: 行长由ruff format管; SIM108/RUF012: 与既有代码风格冲突
# RUF001/002/003: 全角标点为中文项目正常写作, 非缺陷
# PERF401/PERF203/PERF102: 性能微优化让位于可读性; 循环内try/except是逐项错误隔离的既定模式
# RUF015: 自动修复改变异常语义(IndexError→StopIteration), 需逐点决策
# SIM105/SIM102: 风格等价改写; B905: zip(strict=)需逐点语义决策
# N806/E741/A001/A002: 命名与领域惯例(CLI参数名/大写别名)冲突
ignore = [
    "E501", "SIM108", "RUF012", "RUF001", "RUF002", "RUF003",
    "PERF401", "PERF203", "PERF102", "RUF015", "SIM105", "SIM102",
    "B905", "N806", "E741", "A001", "A002",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 的 F401 是合法re-export模式(受__all__约束)
"**/__init__.py" = ["F401"]
# 测试中的未用变量多为fixture占位/断言构造
"tests/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["ai_prompt_toolkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
