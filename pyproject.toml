[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prompt-toolkit"
version = "27.0.0"
description = "AI提示词体系工具链：条件编译、安全扫描、A/B测试、Prompt Linter"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
]
ab_test = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
]
full = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.scripts]
prompt-cli = "ai_prompt_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
