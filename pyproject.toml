[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-prompt-toolkit"
version = "62.0.0"
description = "AI提示词体系工具链：条件编译、安全扫描、A/B测试、Prompt Linter"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ab_test = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
]
full = [
    "httpx>=0.24",
    "scipy>=1.11",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
prompt-cli = "ai_prompt_toolkit.cli_core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["ai_prompt_toolkit"]
omit = ["tests/*", "*/__pycache__/*", "*/playground/*"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH",
    "RUF", "PERF", "PIE", "PYI", "Q",
]
ignore = ["E501", "SIM108", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["ai_prompt_toolkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
strict_equality = true
