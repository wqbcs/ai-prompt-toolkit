# AI Prompt Toolkit — 确定性 prompt 静态门禁 GitHub Action（R252-I-4，P1-01 工件）。
# 第三方接入（P0-03 仓库公开 + P0-04 PyPI 发布后激活）：
#   - uses: <owner>/ai-prompt-toolkit@v1
#     with:
#       target: prompts/
#       fail-on: high
# 设计（奥卡姆 + 03 A1 黄金先例 golangci-lint-action/codeql-action 形态）：
#   纯 Python `actions/setup-python` 即足够 —— 不学 promptfoo code-scan Action 的
#   Node24+OIDC 运行时（我方零 LLM，无 token 计费/OIDC 需求，依赖面更窄）。
#   楔子对齐：零 LLM / 零成本 / 离线可跑 / 逐字节一致 —— CI 一次裁决=每次裁决。
name: 'AI Prompt Toolkit Lint'
description: 'Deterministic prompt static gate (267 rules, zero LLM, <100ms/file) — CI gate + SARIF'
inputs:
  target:
    description: 'Lint 目标（prompt 文件或目录）'
    required: false
    default: '.'
  fail-on:
    description: '阻断阈值（none|low|medium|high|critical）— 命中该级别及以上 → gate fail'
    required: false
    default: 'high'
  format:
    description: '输出格式（cli|json|sarif|summary|html）— sarif 时上传 Code Scanning'
    required: false
    default: 'sarif'
  baseline:
    description: '增量门禁基线 JSON（存量 finding 锁定；空=全量门禁）'
    required: false
    default: ''
  block-on-warn:
    description: 'warn（gate rc=1，如 medium>3）是否阻断流水线（默认否，只记不阻）'
    required: false
    default: 'false'
  version:
    description: '固定版本（空=最新）。P0-04 PyPI 发布后生效'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install ai-prompt-toolkit
      shell: bash
      run: |
        # 需要 P0-04 PyPI 发布（pip install ai-prompt-toolkit）；本仓自身 CI 用本地 venv 不经此 Action
        if [ -n "${{ inputs.version }}" ]; then
          pip install "ai-prompt-toolkit==${{ inputs.version }}"
        else
          pip install ai-prompt-toolkit
        fi

    - name: Prompt Lint (deterministic, zero-LLM)
      id: lint
      shell: bash
      run: |
        ARGS="-t ${{ inputs.target }} --ci --fail-on ${{ inputs.fail-on }} --format ${{ inputs.format }}"
        if [ -n "${{ inputs.format }}" ] && [ "${{ inputs.format }}" = "sarif" ]; then
          ARGS="$ARGS --output promptlint.sarif"
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          ARGS="$ARGS --baseline ${{ inputs.baseline }} --incremental"
        fi
        set +e
        prompt-cli lint $ARGS
        LINT_RC=$?
        set -e
        echo "lint_rc=$LINT_RC" >> "$GITHUB_OUTPUT"
        echo "::notice::prompt-cli lint exit=$LINT_RC (0=pass 1=warn 2=fail)"

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.format == 'sarif' && steps.lint.outputs.lint_rc != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: promptlint.sarif
        category: prompt-lint

    - name: Gate (rc passthrough)
      if: ${{ always() }}
      shell: bash
      run: |
        rc="${{ steps.lint.outputs.lint_rc }}"
        case "$rc" in
          0) echo "✅ prompt gate: pass" ;;
          1)
            if [ "${{ inputs.block-on-warn }}" = "true" ]; then
              echo "::error::prompt gate: warn (rc=1) 且 block-on-warn=true → 阻断"
              exit 1
            fi
            echo "::warning::prompt gate: warn (rc=1) — 记录不阻断 (block-on-warn=false)"
            ;;
          2) echo "::error::prompt gate: fail (rc=2) — 命中 fail-on=${{ inputs.fail-on }} 阈值" && exit 2 ;;
          *) echo "ℹ️ prompt lint 未产生 rc（可能安装/参数失败，见上）" ;;
        esac
