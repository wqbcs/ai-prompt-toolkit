name: Prompt CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/*.md'
      - 'pyproject.toml'
      # R225-P0-02 补: 门禁自身变更必须自测 — 此前改workflow/基线不触发CI,
      # 导致 16a57a5 push 后无任何 run(改门禁却测不了门禁)
      # R225 第2次同根因: 927a330 只改scripts/+ci/ 同样无run — scripts/是门禁链
      # 载体, 必须自测; 至此 paths 覆盖全部"改门禁"路径
      - '.github/workflows/**'
      - 'baselines/**'
      - 'scripts/**'
      - 'ci/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/*.md'
      - 'pyproject.toml'
      - '.github/workflows/**'
      - 'baselines/**'
      - 'scripts/**'
      - 'ci/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # [dev]已钉死ruff/mypy版本(单一源) — 不再裸装最新版,
      # 否则门禁随上游发版随机漂移(R223实证: 0.15.14→0.16.10 format行为变)
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -x -q --tb=short -k "not slow" --cov=ai_prompt_toolkit --cov-report=xml

      # R232-P3-09: linter 包覆盖率棘轮(90% 地板, 只收紧不放松)。
      # 与 pytest 同作业=数据新鲜(coverage.xml 刚产出); 与本地 release_gate 第 2 步同一真源
      - name: "Linter coverage ratchet (≥90%)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_linter_coverage.py

      - name: Docs drift check (rules doc sync with registry)
        if: matrix.python-version == '3.12'
        run: python scripts/gen_rules_doc.py --check

      - name: MyPy type check (ratchet gate)
        if: matrix.python-version == '3.12'
        run: python scripts/check_mypy_ratchet.py

      # 双基线对称棘轮(只降不升): 误报基线抓噪音面, 漏检基线抓检测能力面
      # R212后误报0.96%(阈值0.01防回归); R213修复4条否定盲区后漏检归零,
      # 阈值收紧0.05(见 docs/规则漏检率基线.md CI棘轮约定)
      - name: "False-positive ratchet (dual baseline: noise side)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_false_positives.py --fail-above 0.01

      - name: "Miss-rate ratchet (dual baseline: detection side)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_miss_rate.py --fail-above 0.05

      # R233-P1-10: 缺口报告棘轮(平均缺口率不得比基线差, 只收紧不放松;
      # 程序化调用 gap_report.aggregate 同一真源, 基线=baselines/gap-baseline.json)
      - name: "Gap report ratchet (defense-declaration coverage)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_gap_ratchet.py

      # R242-P2-12: README 分语言检测基线表数字与 run_miss_rate per_language
      # 单一真源核对(防手写漂移; 与本地 release_gate 同命令)
      - name: "Language baseline README check"
        if: matrix.python-version == '3.12'
        run: python scripts/check_language_baseline_readme.py

      # R243-1: 02 总板状态列 vs CHANGELOG 声称 vs sha 存在性三向核对
      # (P3-17 脚本化; 与本地 release_gate 同命令)
      - name: "Board status check"
        if: matrix.python-version == '3.12'
        run: python scripts/check_board_status.py

      # R244-1: <100ms/文件 楔子不变量机器断言 (P2-16 轻量形态;
      # 与本地 release_gate 同命令)
      - name: "Performance wedge (<100ms/file)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_lint_performance.py

      # R246-P2-07: SARIF 离线结构校验 (收口 P2-07 板行验收"SARIF 过 validator"
      # 的离线口径: 零网络零新依赖, air-gap 可用; 与本地 release_gate SARIF 步
      # 同命令真源 check_sarif_schema.py。lint 退出码=findings 判定非命令失败
      # (模板语料预期有 findings), 判绿标准=后续 validator 步的退出码)
      - name: "SARIF schema check (offline structural subset)"
        if: matrix.python-version == '3.12'
        run: |
          set +e
          python -m ai_prompt_toolkit lint -t src/ai_prompt_toolkit/templates --format sarif --output gate-sarif-check.sarif
          LINT_RC=$?
          set -e
          echo "lint rc=$LINT_RC (findings verdict, not command failure)"
          python scripts/check_sarif_schema.py gate-sarif-check.sarif

      # R235-P4-02: 核心零依赖验证(kernel 层零第三方 runtime import;
      # R233-P4-01 手测结论固化为机器护栏; 与 release_gate 第 17 步同命令)
      - name: "Layer deps (kernel zero third-party)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_layer_deps.py

      # R254-P4-10: 分层方向验证(04 §1 依赖方向铁律: 只允许上层 import 下层;
      # 与 check_layer_deps 正交=包内跨层第一方面; 与 release_gate 同命令)
      - name: "Layering (dependency direction)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_layering.py

      # R255-I-1: 过防御二阶信号时间序列断言(棘轮单调+收敛面提示;
      # 与 release_gate 同命令)
      - name: "Overdefense trend (second-order signal)"
        if: matrix.python-version == '3.12'
        run: python scripts/check_overdefense_trend.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        continue-on-error: true  # R231: codecov 上传=第三方可观测性, 非质量门禁。
        # 覆盖率度量已在"Run tests"(pytest --cov)完成并通过; 该步仅把 coverage.xml
        # 上传到 codecov.io(本仓未配置 token/codecov.io, 私有仓)。R231 实证: 同配置
        # 同 action 在 R230 success/R231 failure = 服务端 flake, 且会连带 cancel 3.10/
        # 3.11 矩阵 + skip prompt-lint/quality-gate(needs:test), 把一个观测步抖动放大
        # 成整链红。质量门禁(tests/ruff/mypy/双基线/docs)各自独立判绿, 不依赖此步。
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  prompt-lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Prompt Lint (templates)
        run: |
          prompt-cli lint -t ./src/ai_prompt_toolkit/templates --gate --output lint-report.json
        continue-on-error: true

      - name: Prompt Lint (scenarios)
        run: |
          prompt-cli lint -t ./_scenarios --format json --output scenario-lint.json || true

      - name: Security Scan
        run: |
          prompt-cli scan -t ./src/ai_prompt_toolkit/templates --format json --output scan-report.json || true

      - name: Token Analysis
        run: |
          prompt-cli token -t ./src/ai_prompt_toolkit/templates --compare --output token-report.json || true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-reports
          path: |
            lint-report.json
            scan-report.json
            token-report.json
            scenario-lint.json

  # R237-P3-06: 依赖审计自动化 — 供应链面机器护栏(Shai-Hulud/pkg-inject 热度,
  # R237 调研 §2.3)。独立作业不与 test 矩阵联动: pip-audit 需网络查 PyPI
  # advisory DB, 抖动不该放大成整链红(同 R231 codecov 解耦纪律)。
  # 首 2 版观察期: continue-on-error 收集基线数据; 稳定后去掉该标记转硬门禁。
  # 与 .github/dependabot.yml 周更 PR 互补: dependabot 管"版本新鲜",
  # pip-audit 管"已装版本是否有已知 CVE"。
  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true  # 观察期(首 2 版), R239 评审转硬门禁
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      # R237 缺陷修复: pip-audit -r 只收 requirements 文件, 不接受 pyproject.toml
      # (v2 文档实证: pyproject 只能经已装环境审计) — 声明面审计改为
      # 先装声明依赖再审计已装面(声明面=core+dev 全装, 攻击面不漏)
      - name: "Install declared deps (core+dev)"
        run: pip install -e ".[dev]"

      - name: "pip-audit (declared deps via installed env)"
        run: python -m pip_audit

  # R225-P0-02: push 硬门禁 — 卖"CI门禁"却直推 main 无门禁的叙事漏洞收口
  # 此前本作业仅 pull_request 触发; 现 push main/develop + PR 双触发
  # 设计(05 §Q1): push 作业只跑 gate 不重跑 pytest 矩阵(减重见 P6-03);
  # 判绿标准 = 增量门禁(NEW findings) + release_gate 全链(与本地收口同一真源,
  # 跳 pytest+覆盖率 2 步; 步数真源=release_gate.build_steps(), 此处不硬编码
  # 计数防漂移 — R230-X1 计数硬编码机械债同病)
  prompt-quality-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Red Team Quick Scan
        run: |
          prompt-cli redteam -t ./src/ai_prompt_toolkit/templates --top-n 5 --output redteam-report.json || true

      # 增量门禁: 基线锁存量(183 high 在 R178 部署语境豁免集), 只拦 NEW findings
      # 基线更新纪律: 基线重存必须独立 commit+理由(见 adoption.md)
      - name: "Incremental Gate (NEW findings only)"
        run: |
          prompt-cli lint -t ./src/ai_prompt_toolkit/templates \
            --incremental --baseline baselines/templates-baseline.json --gate

      # 收口门禁链全链(跳过 pytest+覆盖率棘轮, 两者数据在 test 作业):
      # ruff/format/mypy棘轮/双基线/依赖一致性/环境快照/gen_rules_doc/
      # sync/版本一致性/SARIF合法性/ReDoS审计增量/双基线时间序列+sparkline。
      # 步数不硬编码(R248: 硬编码计数随步表增长必漂移, 与 R230-X1 同病)
      - name: "Release Gate (full chain, single source of truth)"
        run: python scripts/release_gate.py --skip 1,2

      - name: Quality Gate Verdict
        run: |
          prompt-cli lint -t ./src/ai_prompt_toolkit/templates --gate || \
            echo "ℹ 存量 gate FAIL 为已知状态(183 high 在豁免集), 阻断面=上方增量门禁"
