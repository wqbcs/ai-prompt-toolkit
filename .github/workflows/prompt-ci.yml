name: Prompt CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/*.md'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '**/*.md'
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install ruff mypy

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -x -q --tb=short -k "not slow" --cov=ai_prompt_toolkit --cov-report=xml

      - name: Docs drift check (rules doc sync with registry)
        if: matrix.python-version == '3.12'
        run: python scripts/gen_rules_doc.py --check

      - name: MyPy type check
        run: mypy src/ai_prompt_toolkit --ignore-missing-imports --no-error-summary || true

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml

  prompt-lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Prompt Lint (templates)
        run: |
          prompt-cli lint -t ./src/ai_prompt_toolkit/templates --gate --output lint-report.json
        continue-on-error: true

      - name: Prompt Lint (scenarios)
        run: |
          prompt-cli lint -t ./_scenarios --format json --output scenario-lint.json || true

      - name: Security Scan
        run: |
          prompt-cli scan -t ./src/ai_prompt_toolkit/templates --format json --output scan-report.json || true

      - name: Token Analysis
        run: |
          prompt-cli token -t ./src/ai_prompt_toolkit/templates --compare --output token-report.json || true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-reports
          path: |
            lint-report.json
            scan-report.json
            token-report.json
            scenario-lint.json

  prompt-quality-gate:
    runs-on: ubuntu-latest
    needs: prompt-lint
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Red Team Quick Scan
        run: |
          prompt-cli redteam -t ./src/ai_prompt_toolkit/templates --top-n 5 --output redteam-report.json || true

      - name: Quality Gate Verdict
        run: |
          prompt-cli lint -t ./src/ai_prompt_toolkit/templates --gate
