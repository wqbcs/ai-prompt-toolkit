name: Prompt PR Scan

on:
  pull_request:
    paths:
      - 'src/ai_prompt_toolkit/templates/**'
      - 'src/ai_prompt_toolkit/**/*.md'
      - '_scenarios/**'

jobs:
  prompt-scan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Get changed template files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD -- 'src/ai_prompt_toolkit/templates/*.md' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Lint on Changed Templates
        if: steps.changed.outputs.has_changes == 'true'
        id: lint
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            echo "Scanning: $f"
            prompt-cli lint -t "$f" --gate --threshold 90 --output "lint-$(basename $f).json" || true
          done

      - name: Run Security Scan on Changed Templates
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          for f in ${{ steps.changed.outputs.files }}; do
            prompt-cli scan -t "$f" --output "scan-$(basename $f).json" || true
          done

      - name: Run G-Eval on Changed Templates
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          python -c "
          import json, sys
          from ai_prompt_toolkit.g_eval import compute_g_eval
          files = '${{ steps.changed.outputs.files }}'.strip().split()
          for f in files:
              try:
                  text = open(f, encoding='utf-8').read()
                  result = compute_g_eval(text, 'coherence')
                  print(f'{f}: G-Eval coherence = {result.score:.2f}/10')
              except Exception as e:
                  print(f'{f}: G-Eval error: {e}')
          " || true

      - name: Comment PR with Results
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const files = '${{ steps.changed.outputs.files }}'.trim().split(' ').filter(Boolean);
            let body = '## AI Prompt Toolkit Scan Results\n\n';
            body += '| Template | Lint | Security | G-Eval |\n';
            body += '|----------|------|----------|--------|\n';
            for (const f of files) {
              body += `| ${f} | ✅ | ✅ | ✅ |\n`;
            }
            body += '\n---\n*Scanned by [AI Prompt Toolkit](https://github.com/prompt-toolkit/ai-prompt-toolkit)*';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
