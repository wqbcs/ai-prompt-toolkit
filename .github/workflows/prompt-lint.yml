name: Prompt Lint & Scan

on:
  push:
    paths:
      - '**/*.md'
      - '_scenarios/**'
  pull_request:
    paths:
      - '**/*.md'
      - '_scenarios/**'

jobs:
  prompt-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Prompt Lint
        run: |
          prompt-cli lint -t ./_scenarios --format json --output lint-report.json || true
          echo "Lint report saved to lint-report.json"

      - name: Security Scan
        run: |
          prompt-cli scan -t ./_scenarios --format json --output scan-report.json || true
          echo "Scan report saved to scan-report.json"

      - name: Evaluate (quick mode)
        run: |
          prompt-cli evaluate -t ./_scenarios --quick --save || true

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-reports
          path: |
            lint-report.json
            scan-report.json

  prompt-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[ab_test]"

      - name: Provider Health Check
        run: prompt-cli doctor --json
        continue-on-error: true
