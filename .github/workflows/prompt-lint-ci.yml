name: Prompt Lint CI

on:
  push:
    branches: [main, develop]
    paths:
      - '**/*.txt'
      - '**/*.md'
      - '**/*.prompt'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.txt'
      - '**/*.md'
      - '**/*.prompt'
      - 'src/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint all prompt templates
        run: |
          apt lint -t prompts/ --format sarif --output prompt-lint-results.sarif
        continue-on-error: true
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prompt-lint-results.sarif
          category: prompt-lint
      - name: Security scan
        run: |
          apt scan -t prompts/ --depth standard
        continue-on-error: true
      - name: Evaluate
        run: |
          apt evaluate -t prompts/ --dimensions D01,D02,D06,D07,D08,D98
        continue-on-error: true

  compliance:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: OWASP LLM Top 10 Compliance
        run: |
          apt compliance -t prompts/ --owasp-pct 80.0
      - name: Huawei Cloud Security Baseline
        run: |
          apt compliance -t prompts/ --framework huaweicloud
