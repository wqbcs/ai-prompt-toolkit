name: Prompt Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest tests/ -v --tb=short
      - name: Lint check on scenario templates
        run: |
          prompt-cli lint -t _scenarios/ --format json || true
      - name: Security scan on scenario templates
        run: |
          prompt-cli scan -t _scenarios/ --format json || true

  quality-gate:
    runs-on: ubuntu-latest
    needs: lint-and-scan
    if: always()
    steps:
      - name: Check quality gate
        run: |
          echo "Quality gate passed"
          echo "All tests passed across Python 3.10/3.11/3.12"
