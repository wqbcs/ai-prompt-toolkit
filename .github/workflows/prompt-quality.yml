name: Prompt Quality Gate

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'prompts/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'prompts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Prompt Lint
        uses: ./.github/actions/prompt-lint
        with:
          target: './prompts'
          threshold: '60'
          format: 'sarif'
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: prompt-lint-results.sarif
