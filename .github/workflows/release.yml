name: Release to PyPI

# R191: tag触发发布 — 推送 v* tag 后构建并发布到 PyPI (trusted publishing, 无需API token)
# 前置: 在PyPI项目 settings/publishing 配置trusted publisher指向本workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  # R319 深审 BLOCK-1: 发布链原零 pytest — release-gate 跑 --skip 1,2(第 1 步
  # =pytest 全量+coverage 被跳过), tag 推送不触发 prompt-ci 的 test 作业 →
  # PyPI 发布(不可逆)前的最后一道闸缺核心正确性门禁。独立 test 作业与 CI
  # prompt-ci.yml test 作业 3.12 lane 逐字同命令(pytest 全量+覆盖率棘轮),
  # release-gate needs: release-test — 恢复"测试绿→门禁"链(同 CI needs:test 形态)。
  release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install with dev deps
        run: pip install -e ".[dev]"

      # 与 CI prompt-ci.yml test 作业 3.12 lane 逐字对齐(命令单源, 两处同改)
      - name: Run tests
        run: pytest tests/ -x -q --tb=short -k "not slow" --cov=ai_prompt_toolkit --cov-report=xml

      # 与 CI 覆盖率棘轮步同命令(数据=上一步 coverage.xml)
      - name: "Linter coverage ratchet (≥90%)"
        run: python scripts/check_linter_coverage.py

  # R306 深审 BLOCK-1: 发布管道原零质量门禁+无 tag↔pyproject 版本断言——
  # PyPI 版本来自 pyproject.toml, ghcr tag 来自 GITHUB_REF, 两独立真源无断言
  # 相等, 首次发布不可逆(PyPI 版本无法静默撤回)。门禁形态与 CI
  # prompt-quality-gate 同(--skip 1,2), 版本断言与 check_version_consistency
  # 同纪律(单源)。
  release-gate:
    needs: release-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install with dev deps
        run: pip install -e ".[dev]"

      - name: Tag ↔ pyproject version assertion
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PYVER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PYVER" ]; then
            echo "::error::tag v$TAG != pyproject version $PYVER — 版本双源漂移, 拒绝发布"
            exit 1
          fi
          echo "version assertion passed: $TAG"

      # R319 深审 MINOR: release_gate 第 10 步是"重生成"(恒绿), tag 推送不触发
      # prompt-ci 的 --check 校验作业 → 发布路径 docs 漂移无门禁, 此处补校验态
      - name: Docs drift check (rules doc sync with registry)
        run: python scripts/gen_rules_doc.py --check

      - name: "Release gate (同 CI 形态: --skip 1,2)"
        run: python scripts/release_gate.py --skip 1,2

  release-build:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Upload dists artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
      contents: read

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # R289: Docker 双通道（06 §4 "一次发版=PyPI+镜像双通道"）— needs: pypi-publish
  # lockstep（PyPI 成功后才发镜像，避免通道间版本漂移）。ghcr 3 tag 策略=
  # latest+全版本+主版本（air-gap 用户按主版本锁，06 §4）。GITHUB_TOKEN 推
  # ghcr 为 Actions 内建权限（packages: write），无需外部凭据。镜像名口径=
  # ai-prompt-toolkit（06 §4 验收 + Dockerfile LABEL 同口径；02 板行旧口径
  # prompt-lint 废弃）。06 §4 验收命令（docker run … baseline）内置为 CI
  # smoke = 首次发布机器验证，非人工后置。
  docker-publish:
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: read
      packages: write  # GITHUB_TOKEN ghcr 推送（Actions 内建权限）

    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MAJOR="${TAG%%.*}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # R319 深审 MAJOR: 不指定 target 默认取末阶段 playground(Web UI,
          # ENTRYPOINT []) — 06 §4 验收 `docker run … baseline` 会执行不存在的
          # baseline 二进制, 首发 smoke 必红(而 R306 prompt-cli --help smoke
          # 显式传参恰好绕开=假信心)。产品形态=CLI(PyPI 包即 CLI), 发布 base
          # 阶段; playground 阶段保留供本地开发(scripts/playground.py)。
          target: base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:latest
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 06 §4 验收: base 阶段 ENTRYPOINT ["prompt-cli"] → 实际执行
      # `prompt-cli baseline`(真实子命令, 双基线自证)
      - name: "Smoke — 验收（06 §4: docker run baseline）"
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.version }} baseline

      # R306 深审 M-1 回归护栏 + R319: base 阶段 ENTRYPOINT ["prompt-cli"],
      # 裸 `docker run … --help` 实际执行 `prompt-cli --help` — 验证入口在
      # 最终镜像可用(原显式传 prompt-cli 在 base 阶段下会变
      # `prompt-cli prompt-cli --help` 必败, 随 target 切换修正)
      - name: "Smoke — prompt-cli 入口可用"
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.version }} --help
