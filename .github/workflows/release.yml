name: Release to PyPI

# R191: tag触发发布 — 推送 v* tag 后构建并发布到 PyPI (trusted publishing, 无需API token)
# 前置: 在PyPI项目 settings/publishing 配置trusted publisher指向本workflow

on:
  push:
    tags:
      - 'v*'

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: |
          python -m build
          twine check dist/*

      - name: Upload dists artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: release-build
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC)
      contents: read

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # R289: Docker 双通道（06 §4 "一次发版=PyPI+镜像双通道"）— needs: pypi-publish
  # lockstep（PyPI 成功后才发镜像，避免通道间版本漂移）。ghcr 3 tag 策略=
  # latest+全版本+主版本（air-gap 用户按主版本锁，06 §4）。GITHUB_TOKEN 推
  # ghcr 为 Actions 内建权限（packages: write），无需外部凭据。镜像名口径=
  # ai-prompt-toolkit（06 §4 验收 + Dockerfile LABEL 同口径；02 板行旧口径
  # prompt-lint 废弃）。06 §4 验收命令（docker run … baseline）内置为 CI
  # smoke = 首次发布机器验证，非人工后置。
  docker-publish:
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      contents: read
      packages: write  # GITHUB_TOKEN ghcr 推送（Actions 内建权限）

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MAJOR="${TAG%%.*}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:latest
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Smoke — 验收（06 §4: docker run baseline）"
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/ai-prompt-toolkit:${{ steps.version.outputs.version }} baseline
