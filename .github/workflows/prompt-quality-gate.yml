name: Prompt Quality Gate

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ai-prompt-toolkit
        run: pip install -e ".[dev]"

      - name: Lint Check
        id: lint
        run: |
          prompt-cli lint -t ./_scenarios --format json --output lint-result.json
          echo "lint_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Security Scan Check
        id: scan
        run: |
          prompt-cli scan -t ./_scenarios --format json --output scan-result.json
          echo "scan_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Evaluate Quality Gate
        id: evaluate
        run: |
          prompt-cli evaluate -t ./_scenarios --quick --threshold 5.0
          echo "eval_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Quality Gate Result
        run: |
          echo "## Prompt Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | ${{ steps.scan.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Eval | ${{ steps.evaluate.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if quality gate not met
        if: steps.lint.outcome != 'success' || steps.scan.outcome != 'success'
        run: |
          echo "Quality gate failed!"
          exit 1
