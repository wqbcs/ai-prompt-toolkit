name: Daily Security Scorecard

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install ai-prompt-toolkit
        # R336: 必须装 [dev] — 漂移检查 _collect_test_count 用 pytest --collect-only
        # 统计测试数（R329 起与 sync_badges 同口径）, 裸 -e . 无 pytest → 作业恒红
        # （2700d62 引入后 10-20 起连红; 同 prompt-ci test / release-test 安装形态）
        run: pip install -e ".[dev]"
      - name: Check README metrics drift (R207-6)
        run: python3 scripts/sync_readme_metrics.py
      - name: Run Scorecard on all prompts
        run: |
          echo "=== 安全评分卡(5维度) ==="
          for f in $(find . -name '*.prompt' -o -name '*.md' | head -50); do
            # R306 深审 M-3: score 命令无 --output 选项(仅 --target/--format),
            # 原行被 || true 吞掉=死步, 主产物从未生成。改 stdout 重定向。
            prompt-cli score --target "$f" --format json > "scorecard-$(basename $f).json" || true
          done
          FOUND=$(find . -name '*.prompt' -o -name '*.md' | wc -l)
          if [ "$FOUND" -gt 0 ] && ! ls scorecard-*.json >/dev/null 2>&1; then
            echo "::error::scorecard 产物为空 — score 步全部失败(死步)"
            exit 1
          fi
      - name: Run Compliance on all prompts
        run: |
          echo "=== 华为云合规报告(7域) ==="
          for f in $(find . -name '*.prompt' -o -name '*.md' | head -50); do
            prompt-cli compliance --target "$f" --format json --output "compliance-$(basename $f).json" || true
          done
      - name: Generate Summary
        run: |
          python3 -c "
          import json, glob, os
          scores, grades = [], {'A':0,'B':0,'C':0,'D':0,'F':0}
          for f in glob.glob('scorecard-*.json'):
              try:
                  d = json.load(open(f))
                  scores.append(d.get('overall_score', 0))
                  g = d.get('grade', 'F')
                  grades[g] = grades.get(g, 0) + 1
              except: pass
          avg = sum(scores)/len(scores) if scores else 0
          print(f'## 安全评分卡摘要')
          print(f'- 平均分: {avg:.1f}/100')
          print(f'- 评分分布: A={grades[\"A\"]} B={grades[\"B\"]} C={grades[\"C\"]} D={grades[\"D\"]} F={grades[\"F\"]}')
          print(f'- 扫描文件: {len(scores)}')
          " > scorecard-summary.md
          cat scorecard-summary.md
      - name: Upload Scorecard Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-scorecard-reports
          path: |
            scorecard-*.json
            compliance-*.json
            scorecard-summary.md
          retention-days: 90
