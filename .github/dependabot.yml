# R237-P3-06: 依赖审计自动化 — dependabot 双生态周更
# 供应链面热度实证(R237 调研 §2.3): Shai-Hulud PyPI 扩展 + pkg-inject 包元数据
# 注入 — 发布到 PyPI 后本仓自身即供应链对象, 依赖面必须机器化审计。
# 纪律: 只周更 PR 不自动合(依赖变更=行为变更, 必须过门禁链人工确认)。
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(pip)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(actions)"
