<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prompt Toolkit Playground</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#ffffff;--surface:#f8fafc;--text:#1e293b;--text2:#64748b;--border:#e2e8f0;--primary:#3b82f6;--editor-bg:#1e293b;--editor-fg:#e2e8f0}
[data-theme="dark"]{--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;--primary:#818cf8;--editor-bg:#0f172a;--editor-fg:#a5f3fc}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0;background:var(--bg);color:var(--text)}
.editor{font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;resize:none;
  border:1px solid var(--border);border-radius:6px;padding:12px;width:100%;
  background:var(--editor-bg);color:var(--editor-fg);tab-size:2}
.editor:focus{outline:none;border-color:var(--primary)}
.panel-header{background:var(--surface);padding:8px 12px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:14px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.status-ok{background:#dcfce7;color:#166534}
.status-err{background:#fee2e2;color:#991b1b}
.branch-info{font-size:11px;color:var(--text2);padding:4px 12px;background:var(--surface);border-top:1px solid var(--border)}
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:6px 14px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;background:var(--surface)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}
.lint-gauge{width:48px;height:48px;position:relative;display:inline-block}
.lint-gauge svg{transform:rotate(-90deg)}
.lint-gauge-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:700}
.lint-finding{font-size:11px;padding:3px 8px;margin:2px 0;border-radius:4px;display:flex;align-items:center;gap:4px}
.lint-high{background:#fef2f2;color:#991b1b;border-left:3px solid #ef4444}
.lint-medium{background:#fffbeb;color:#92400e;border-left:3px solid #f59e0b}
.lint-low{background:#f0fdf4;color:#166534;border-left:3px solid #22c55e}
.scan-critical{background:#fef2f2;color:#991b1b;border-left:3px solid #dc2626}
.scan-high{background:#fef2f2;color:#991b1b;border-left:3px solid #ef4444}
.scan-medium{background:#fffbeb;color:#92400e;border-left:3px solid #f59e0b}
.scan-low{background:#f0fdf4;color:#166534;border-left:3px solid #22c55e}
.radar-chart{max-width:320px;max-height:320px;margin:0 auto}
.eval-score{font-size:36px;font-weight:700;text-align:center;margin:8px 0}
.eval-dim{font-size:11px;padding:2px 8px;margin:1px 0;display:flex;justify-content:space-between;border-bottom:1px solid var(--border)}
.theme-btn{font-size:14px;padding:2px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.market-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .15s}
.market-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.market-card h4{margin:0 0 4px;font-size:13px;color:var(--text)}
.market-card p{margin:0;font-size:11px;color:var(--text2);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.market-card .card-meta{display:flex;gap:8px;margin-top:6px;font-size:10px;color:var(--text2)}
.market-card .card-tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--surface);border:1px solid var(--border)}
.market-card .card-score{font-weight:600;color:#22c55e}
.trace-item{padding:8px 12px;border-left:3px solid var(--primary);margin:4px 0;background:var(--bg);border-radius:0 4px 4px 0;font-size:11px}
.trace-item .trace-name{font-weight:600;color:var(--text)}
.trace-item .trace-time{color:var(--text2);font-size:10px}
.trace-item .trace-dur{color:var(--primary);font-weight:500}
.trace-span{margin:2px 0 2px 16px;padding:4px 8px;border-left:2px solid var(--border);font-size:10px;color:var(--text2)}
</style>
</head>
<body>
<div class="flex flex-col h-screen">
  <header style="background:var(--surface);border-bottom:1px solid var(--border);padding:4px 16px;display:flex;align-items:center;justify-content:space-between">
    <div class="flex items-center gap-3">
      <h1 style="font-size:16px;font-weight:700;color:var(--text)">AI Prompt Toolkit Playground</h1>
      <span style="font-size:11px;color:var(--text2)" id="version-badge"></span>
    </div>
    <div class="flex items-center gap-2">
      <label style="font-size:11px;color:var(--text2)">模型:</label>
      <input id="ctx-model" type="text" value="gpt-4o" style="border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;width:80px;background:var(--bg);color:var(--text)">
      <label style="font-size:11px;color:var(--text2)">语言:</label>
      <input id="ctx-lang" type="text" value="zh-CN" style="border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;width:60px;background:var(--bg);color:var(--text)">
      <label style="font-size:11px;color:var(--text2)">行业:</label>
      <input id="ctx-industry" type="text" value="" placeholder="可选" style="border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:11px;width:70px;background:var(--bg);color:var(--text)">
      <button id="btn-compile" style="background:var(--primary);color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;border:none;cursor:pointer">编译</button>
      <button class="theme-btn" id="btn-theme">🌙</button>
    </div>
  </header>
  <div class="flex flex-1 overflow-hidden">
    <div class="flex-1 flex flex-col" style="border-right:1px solid var(--border)">
      <div class="panel-header"><span>模板源码</span><span style="font-size:11px;color:var(--text2)">{{#if expr}}...{{else}}...{{/if}}</span></div>
      <textarea id="source-editor" class="editor" style="height:calc(100vh - 100px)" spellcheck="false" placeholder="输入模板内容">{{#if model=="gpt-4o"}}
你正在使用GPT-4o模型，请发挥其多模态优势。
{{#if language=="en-US"}}
Please leverage GPT-4o's multimodal capabilities.
{{else}}
请发挥GPT-4o的多模态能力优势。
{{/if}}
{{else}}
你正在使用通用模型，请提供准确、有帮助的回答。
{{/if}}</textarea>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="tab-bar">
        <div class="tab active" data-tab="compile">编译</div>
        <div class="tab" data-tab="lint">Lint</div>
        <div class="tab" data-tab="scan">安全扫描</div>
        <div class="tab" data-tab="evaluate">评估</div>
        <div class="tab" data-tab="market">模板市场</div>
        <div class="tab" data-tab="dataset">数据集</div>
        <div class="tab" data-tab="trace">追踪</div>
      </div>
      <div id="tab-compile" class="tab-content" style="flex:1;flex-direction:column;display:flex;overflow:hidden">
        <div class="panel-header"><span>编译结果</span><span id="compile-status" class="status-badge status-ok">就绪</span></div>
        <pre id="result-editor" class="editor" style="height:calc(50vh - 110px)">点击"编译"或修改模板后自动编译...</pre>
        <div id="branch-info" class="branch-info"></div>
      </div>
      <div id="tab-lint" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header">
          <div class="flex items-center gap-2"><span>Lint检查</span>
            <div id="lint-gauge" class="lint-gauge" style="display:none">
              <svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="var(--border)" stroke-width="4"/><circle id="lint-gauge-arc" cx="24" cy="24" r="20" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="125.66" stroke-dashoffset="125.66" stroke-linecap="round"/></svg>
              <span id="lint-gauge-text" class="lint-gauge-text">0</span>
            </div>
          </div>
          <span id="lint-count" style="font-size:11px;color:var(--text2)"></span>
        </div>
        <div id="lint-findings" style="flex:1;overflow:auto;background:var(--surface);padding:8px"><p style="font-size:11px;color:var(--text2)">Lint结果将在此显示...</p></div>
      </div>
      <div id="tab-scan" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header"><span>安全扫描</span><span id="scan-status" style="font-size:11px;color:var(--text2)"></span></div>
        <div id="scan-findings" style="flex:1;overflow:auto;background:var(--surface);padding:8px"><p style="font-size:11px;color:var(--text2)">安全扫描结果将在此显示...</p></div>
      </div>
      <div id="tab-evaluate" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header"><span>质量评估</span><span id="eval-status" style="font-size:11px;color:var(--text2)"></span></div>
        <div style="flex:1;overflow:auto;background:var(--surface);padding:12px">
          <div id="eval-score" class="eval-score">--</div>
          <svg id="eval-radar" class="radar-chart" viewBox="0 0 300 300"></svg>
          <div id="eval-dims" style="margin-top:8px"><p style="font-size:11px;color:var(--text2)">评估结果将在此显示...</p></div>
        </div>
      </div>
      <div id="tab-market" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header">
          <span>模板市场</span>
          <div class="flex items-center gap-2">
            <input id="market-search" type="text" placeholder="搜索模板..." style="border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:11px;width:120px;background:var(--bg);color:var(--text)">
            <select id="market-category" style="border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:11px;background:var(--bg);color:var(--text)">
              <option value="">全部分类</option>
            </select>
            <select id="market-sort" style="border:1px solid var(--border);border-radius:4px;padding:2px 4px;font-size:11px;background:var(--bg);color:var(--text)">
              <option value="updated_at">最近更新</option>
              <option value="avg_rating">最高评分</option>
              <option value="favorite_count">最多收藏</option>
              <option value="lint_score">Lint分数</option>
            </select>
          </div>
        </div>
        <div id="market-grid" style="flex:1;overflow:auto;background:var(--surface);padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;align-content:start">
          <p style="font-size:11px;color:var(--text2);grid-column:1/-1">加载模板市场中...</p>
        </div>
        <div id="market-pagination" style="padding:6px 12px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text2)"></div>
      </div>
      <div id="tab-dataset" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header">
          <span>数据集</span>
          <div class="flex items-center gap-2">
            <button id="ds-create-btn" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--primary);color:#fff;cursor:pointer">新建</button>
            <button id="ds-import-btn" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer">导入</button>
            <button id="ds-run-btn" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer">运行</button>
          </div>
        </div>
        <div id="ds-list" style="flex:1;overflow:auto;background:var(--surface);padding:8px">
          <p style="font-size:11px;color:var(--text2)">加载数据集列表...</p>
        </div>
        <div id="ds-detail" style="display:none;flex:1;overflow:auto;background:var(--surface);padding:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <h3 id="ds-detail-name" style="margin:0;font-size:14px;color:var(--text)"></h3>
            <button id="ds-back-btn" style="font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer">返回</button>
          </div>
          <div id="ds-cases"></div>
          <button id="ds-add-case-btn" style="margin-top:8px;font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid var(--primary);background:var(--surface);color:var(--primary);cursor:pointer">添加用例</button>
        </div>
      </div>
      <div id="tab-trace" class="tab-content" style="flex:1;flex-direction:column;display:none;overflow:hidden">
        <div class="panel-header"><span>操作追踪</span><span id="trace-status" style="font-size:11px;color:var(--text2)"></span></div>
        <div id="trace-timeline" style="flex:1;overflow:auto;background:var(--surface);padding:8px"><p style="font-size:11px;color:var(--text2)">操作追踪将在此显示...</p></div>
      </div>
    </div>
  </div>
</div>
<script>
let debounceTimer=null,lintTimer=null,scanTimer=null,evalTimer=null;
const srcEditor=document.getElementById('source-editor');
const resultEditor=document.getElementById('result-editor');
const statusBadge=document.getElementById('compile-status');
const branchInfo=document.getElementById('branch-info');
const btnCompile=document.getElementById('btn-compile');
const btnTheme=document.getElementById('btn-theme');

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.style.display='none');
  document.getElementById('tab-'+name).style.display='flex';
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  btnTheme.textContent=next==='dark'?'☀️':'🌙';
}
(function(){const s=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',s);btnTheme.textContent=s==='dark'?'☀️':'🌙'})();
btnTheme.addEventListener('click',toggleTheme);

async function compile(){
  const template=srcEditor.value;
  const context={model:document.getElementById('ctx-model').value,language:document.getElementById('ctx-lang').value,industry:document.getElementById('ctx-industry').value};
  try{
    const resp=await fetch('/api/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template,context})});
    const data=await resp.json();
    if(data.status==='success'){
      resultEditor.textContent=data.compiled_text;
      statusBadge.textContent='编译成功';statusBadge.className='status-badge status-ok';
      const r=data.report||{};
      branchInfo.textContent=`激活分支: ${r.activated_branches?.length||0} | 忽略分支: ${r.ignored_branches?.length||0} | 警告: ${r.warnings?.length||0}`;
    }else{
      resultEditor.textContent='错误: '+(data.error||'未知错误');statusBadge.textContent='编译失败';statusBadge.className='status-badge status-err';branchInfo.textContent='';
    }
  }catch(e){resultEditor.textContent='网络错误: '+e.message;statusBadge.textContent='连接失败';statusBadge.className='status-badge status-err'}
}

async function runLint(){
  const template=srcEditor.value;
  try{
    const resp=await fetch('/api/lint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template,template_type:'prompt'})});
    const data=await resp.json();
    if(data.status==='success')updateLintUI(data.score,data.findings);
  }catch(e){console.error('Lint error:',e)}
}

async function runScan(){
  const template=srcEditor.value;
  try{
    const resp=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template})});
    const data=await resp.json();
    if(data.status==='success')updateScanUI(data.total_findings,data.findings);
  }catch(e){console.error('Scan error:',e)}
}

function updateLintUI(score,findings){
  const gauge=document.getElementById('lint-gauge'),arc=document.getElementById('lint-gauge-arc'),text=document.getElementById('lint-gauge-text'),count=document.getElementById('lint-count'),container=document.getElementById('lint-findings');
  gauge.style.display='inline-block';
  const pct=score/100,circ=2*Math.PI*20;
  arc.setAttribute('stroke-dashoffset',circ*(1-pct));
  arc.setAttribute('stroke',score>=80?'#22c55e':score>=60?'#f59e0b':'#ef4444');
  text.textContent=Math.round(score);
  text.style.color=score>=80?'#166534':score>=60?'#92400e':'#991b1b';
  count.textContent=findings.length+'个问题';
  if(!findings.length){container.innerHTML='<p style="font-size:11px;color:#22c55e;font-weight:600">所有检查通过！</p>';return}
  const sevMap={high:'lint-high',medium:'lint-medium',low:'lint-low',info:'lint-low',critical:'lint-high'};
  container.innerHTML=findings.map(f=>`<div class="lint-finding ${sevMap[f.severity]||'lint-low'}"><strong>${f.rule_id}</strong> ${f.description}</div>`).join('');
}

function updateScanUI(total,findings){
  const status=document.getElementById('scan-status'),container=document.getElementById('scan-findings');
  status.textContent=total+'个发现';
  if(!total){container.innerHTML='<p style="font-size:11px;color:#22c55e;font-weight:600">安全扫描通过！未发现注入风险。</p>';return}
  const sevMap={critical:'scan-critical',high:'scan-high',medium:'scan-medium',low:'scan-low',info:'scan-low'};
  container.innerHTML=findings.map(f=>`<div class="lint-finding ${sevMap[f.severity]||'scan-low'}"><strong>${f.rule_id}</strong> ${f.description}</div>`).join('');
}

async function runEvaluate(){
  const template=srcEditor.value;
  try{
    const resp=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template,template_type:'prompt'})});
    const data=await resp.json();
    if(data.status==='success')updateEvalUI(data.overall_score,data.dimension_scores);
  }catch(e){console.error('Evaluate error:',e)}
}

function updateEvalUI(score,dimScores){
  const scoreEl=document.getElementById('eval-score'),dimsEl=document.getElementById('eval-dims'),radarEl=document.getElementById('eval-radar'),statusEl=document.getElementById('eval-status');
  scoreEl.textContent=score.toFixed(1);
  scoreEl.style.color=score>=80?'#22c55e':score>=60?'#f59e0b':'#ef4444';
  statusEl.textContent='62维度评估';
  const entries=Object.entries(dimScores);
  if(!entries.length){dimsEl.innerHTML='<p style="font-size:11px;color:var(--text2)">无维度数据</p>';return}
  dimsEl.innerHTML=entries.map(([k,v])=>`<div class="eval-dim"><span>${k}</span><span style="font-weight:600;color:${v>=8?'#22c55e':v>=5?'#f59e0b':'#ef4444'}">${v.toFixed(1)}</span></div>`).join('');
  drawRadar(entries);
}

function drawRadar(entries){
  const svg=document.getElementById('eval-radar');
  const n=Math.min(entries.length,12);
  const items=entries.slice(0,n);
  const cx=150,cy=150,r=110;
  const angleStep=2*Math.PI/n;
  let paths='';
  for(let ring=1;ring<=5;ring++){
    const rr=r*ring/5;
    let pts=[];
    for(let i=0;i<n;i++){const a=angleStep*i-Math.PI/2;pts.push(`${cx+rr*Math.cos(a)},${cy+rr*Math.sin(a)}`)}
    paths+=`<polygon points="${pts.join(' ')}" fill="none" stroke="var(--border)" stroke-width="0.5"/>`;
  }
  for(let i=0;i<n;i++){const a=angleStep*i-Math.PI/2;paths+=`<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="var(--border)" stroke-width="0.5"/>`}
  let dataPts=[];
  for(let i=0;i<n;i++){const v=items[i][1]/10;const a=angleStep*i-Math.PI/2;dataPts.push(`${cx+r*v*Math.cos(a)},${cy+r*v*Math.sin(a)}`)}
  paths+=`<polygon points="${dataPts.join(' ')}" fill="rgba(59,130,246,0.25)" stroke="#3b82f6" stroke-width="1.5"/>`;
  for(let i=0;i<n;i++){const a=angleStep*i-Math.PI/2;const v=items[i][1]/10;paths+=`<circle cx="${cx+r*v*Math.cos(a)}" cy="${cy+r*v*Math.sin(a)}" r="3" fill="#3b82f6"/>`;paths+=`<text x="${cx+(r+16)*Math.cos(a)}" y="${cy+(r+16)*Math.sin(a)}" text-anchor="middle" dominant-baseline="middle" fill="var(--text2)" font-size="9">${items[i][0]}</text>`}
  svg.innerHTML=paths;
}

btnCompile.addEventListener('click',compile);
srcEditor.addEventListener('input',()=>{
  clearTimeout(debounceTimer);clearTimeout(lintTimer);clearTimeout(scanTimer);clearTimeout(evalTimer);
  debounceTimer=setTimeout(compile,500);
  lintTimer=setTimeout(runLint,800);
  scanTimer=setTimeout(runScan,1200);
  evalTimer=setTimeout(runEvaluate,1500);
});
['ctx-model','ctx-lang','ctx-industry'].forEach(id=>{document.getElementById(id).addEventListener('change',compile)});
fetch('/api/version').then(r=>r.json()).then(d=>{document.getElementById('version-badge').textContent='v'+d.version}).catch(()=>{});
compile();runLint();runScan();runEvaluate();

let marketPage=1,marketTimer=null;
async function loadMarket(){
  const q=document.getElementById('market-search').value;
  const cat=document.getElementById('market-category').value;
  const sort=document.getElementById('market-sort').value;
  const grid=document.getElementById('market-grid');
  const pag=document.getElementById('market-pagination');
  try{
    const params=new URLSearchParams({q,category:cat,sort,page:marketPage,page_size:'12'});
    const resp=await fetch('/api/market/templates?'+params);
    const data=await resp.json();
    const templates=data.templates||[];
    if(!templates.length){grid.innerHTML='<p style="font-size:11px;color:var(--text2);grid-column:1/-1">暂无模板，可通过CLI提交: prompt-cli market submit</p>';pag.textContent='';return}
    grid.innerHTML=templates.map(t=>{
      const scoreColor=t.lint_score>=80?'#22c55e':t.lint_score>=60?'#f59e0b':'#ef4444';
      const secIcon=t.security_scan_passed?'&#10003;':'&#10007;';
      const secColor=t.security_scan_passed?'#22c55e':'#ef4444';
      const tags=(t.tags||[]).slice(0,3).map(tg=>`<span class="card-tag">${tg}</span>`).join('');
      return `<div class="market-card" data-id="${t.id}" onclick="loadTemplateToEditor('${t.id}')">
        <h4>${t.name||t.id}</h4>
        <p>${t.description||'暂无描述'}</p>
        <div class="card-meta">
          <span class="card-score" style="color:${scoreColor}">Lint:${t.lint_score}</span>
          <span style="color:${secColor}">安全${secIcon}</span>
          <span>&#9733;${t.avg_rating.toFixed(1)}</span>
          <span>&#9829;${t.favorite_count}</span>
        </div>
        ${tags?'<div style="margin-top:4px;display:flex;gap:3px;flex-wrap:wrap">'+tags+'</div>':''}
      </div>`;
    }).join('');
    const total=data.total||0;
    const maxPage=Math.ceil(total/12);
    pag.innerHTML=`<span>共${total}个模板</span><div style="display:flex;gap:4px;align-items:center">
      <button onclick="marketPage=Math.max(1,marketPage-1);loadMarket()" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);cursor:pointer" ${marketPage<=1?'disabled':''}>&lt;</button>
      <span>${marketPage}/${maxPage}</span>
      <button onclick="marketPage=Math.min(${maxPage},marketPage+1);loadMarket()" style="font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);color:var(--text);cursor:pointer" ${marketPage>=maxPage?'disabled':''}>&gt;</button>
    </div>`;
  }catch(e){grid.innerHTML='<p style="font-size:11px;color:#ef4444;grid-column:1/-1">加载失败: '+e.message+'</p>'}
}
async function loadCategories(){
  try{
    const resp=await fetch('/api/market/categories');
    const data=await resp.json();
    const sel=document.getElementById('market-category');
    (data.categories||[]).forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o)});
  }catch(e){}
}
async function loadTemplateToEditor(id){
  try{
    const resp=await fetch('/api/market/templates/'+id);
    const t=await resp.json();
    if(t.name){srcEditor.value=t.name+'\n\n'+(t.description||'');compile();runLint();runScan();runEvaluate();switchTab('compile')}
  }catch(e){console.error('load template error:',e)}
}
document.getElementById('market-search').addEventListener('input',()=>{clearTimeout(marketTimer);marketTimer=setTimeout(()=>{marketPage=1;loadMarket()},300)});
document.getElementById('market-category').addEventListener('change',()=>{marketPage=1;loadMarket()});
document.getElementById('market-sort').addEventListener('change',()=>{marketPage=1;loadMarket()});

let traceData=[];
function recordTrace(name,durationMs,spans){
  traceData.unshift({name,durationMs,spans:spans||[],time:new Date().toLocaleTimeString()});
  if(traceData.length>50)traceData.length=50;
  updateTraceUI();
}
function updateTraceUI(){
  const el=document.getElementById('trace-timeline');
  const status=document.getElementById('trace-status');
  status.textContent=traceData.length+'条记录';
  if(!traceData.length){el.innerHTML='<p style="font-size:11px;color:var(--text2)">执行操作后将自动记录追踪信息</p>';return}
  el.innerHTML=traceData.map(t=>{
    const spansHtml=(t.spans||[]).map(s=>`<div class="trace-span">${s.name} — ${s.duration_ms.toFixed(0)}ms ${s.status==='error'?'<span style="color:#ef4444">&#10007;</span>':''}</div>`).join('');
    return `<div class="trace-item">
      <div style="display:flex;justify-content:space-between"><span class="trace-name">${t.name}</span><span class="trace-dur">${t.durationMs.toFixed(0)}ms</span></div>
      <div class="trace-time">${t.time}</div>
      ${spansHtml}
    </div>`;
  }).join('');
}

const _origCompile=compile;
const _origRunLint=runLint;
const _origRunScan=runScan;
const _origRunEvaluate=runEvaluate;

compile=async function(){
  const start=performance.now();
  await _origCompile();
  recordTrace('编译',performance.now()-start);
};
runLint=async function(){
  const start=performance.now();
  await _origRunLint();
  recordTrace('Lint',performance.now()-start);
};
runScan=async function(){
  const start=performance.now();
  await _origRunScan();
  recordTrace('安全扫描',performance.now()-start);
};
runEvaluate=async function(){
  const start=performance.now();
  await _origRunEvaluate();
  recordTrace('评估',performance.now()-start);
};

loadCategories();loadMarket();

let currentDsId=null;
async function loadDatasets(){
  const el=document.getElementById('ds-list');
  try{
    const resp=await fetch('/api/datasets');
    const data=await resp.json();
    const datasets=data.datasets||[];
    if(!datasets.length){el.innerHTML='<p style="font-size:11px;color:var(--text2)">暂无数据集，点击"新建"创建</p>';return}
    el.innerHTML=datasets.map(d=>`<div class="market-card" onclick="showDatasetDetail('${d.dataset_id}')">
      <h4>${d.name}</h4><p>${d.description||'暂无描述'}</p>
      <div class="card-meta"><span>${d.case_count}条用例</span><span>${d.updated_at.substring(0,10)}</span></div>
    </div>`).join('');
  }catch(e){el.innerHTML='<p style="font-size:11px;color:#ef4444">加载失败</p>'}
}
async function showDatasetDetail(id){
  currentDsId=id;
  document.getElementById('ds-list').style.display='none';
  document.getElementById('ds-detail').style.display='block';
  try{
    const resp=await fetch('/api/datasets/'+id);
    const data=await resp.json();
    document.getElementById('ds-detail-name').textContent=data.name||id;
    const cases=data.cases||[];
    document.getElementById('ds-cases').innerHTML=cases.map(c=>`<div class="trace-item">
      <div style="display:flex;justify-content:space-between"><span class="trace-name">${c.input_text.substring(0,50)}</span><span style="font-size:10px;color:var(--text2)">${c.case_id.substring(0,8)}</span></div>
    </div>`).join('')||'<p style="font-size:11px;color:var(--text2)">暂无用例</p>';
  }catch(e){}
}
document.getElementById('ds-back-btn').addEventListener('click',()=>{
  document.getElementById('ds-list').style.display='block';
  document.getElementById('ds-detail').style.display='none';
  currentDsId=null;
});
document.getElementById('ds-create-btn').addEventListener('click',async()=>{
  const name=prompt('数据集名称:');
  if(!name)return;
  await fetch('/api/datasets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  loadDatasets();
});
document.getElementById('ds-add-case-btn').addEventListener('click',async()=>{
  if(!currentDsId)return;
  const input=prompt('输入文本:');
  if(!input)return;
  await fetch('/api/datasets/'+currentDsId+'/cases',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input,expected:''})});
  showDatasetDetail(currentDsId);
});
document.getElementById('ds-run-btn').addEventListener('click',async()=>{
  if(!currentDsId){alert('请先选择数据集');return}
  const btn=document.getElementById('ds-run-btn');btn.textContent='运行中...';btn.disabled=true;
  try{
    const resp=await fetch('/api/datasets/'+currentDsId+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run_type:'all'})});
    const data=await resp.json();
    const results=data.results||[];
    alert(`运行完成: ${results.filter(r=>r.status==='completed').length}/${results.length} 成功`);
  }catch(e){alert('运行失败')}finally{btn.textContent='运行';btn.disabled=false}
});
loadDatasets();
</script>
