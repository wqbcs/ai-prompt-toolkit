## 二、预定义A/B测试计划

### AB-04-01: DeepSeek CoT+自纠错 vs 标准审查

```yaml
ab_test_config:
  test_id: "AB-04-01"
  test_name: "DeepSeek-V3 CoT+自纠错 vs 标准代码审查"
  description: "验证DeepSeek-V3的CoT+自纠错组合指令相比标准审查的质量提升"
  
  variants:
    control:
      name: "标准代码审查"
      prompt_version: "v4.6.0"
      model: "deepseek-v3"
      prompt_template: "04_代码审查_标准"
      weight: 0.5
      
    treatment:
      name: "CoT+自纠错审查"
      prompt_version: "v4.7.0"
      model: "deepseek-v3"
      prompt_template: "04_代码审查_CoT_自纠错"
      weight: 0.5
  
  evaluation:
    primary_metric: "issue_detection_accuracy"
    secondary_metrics: ["false_positive_rate", "output_format_compliance", "avg_response_time"]
    evaluation_method: "llm_as_judge"
    judge_model: "gpt-4"
    sample_size: 100
    confidence_level: 0.95
```

### AB-01-01: Qwen JSON模式 vs 标准PRD生成

```yaml
ab_test_config:
  test_id: "AB-01-01"
  test_name: "Qwen-Max JSON模式 vs 标准PRD生成"
  description: "验证Qwen-Max JSON模式+结构化输出对PRD质量的提升"
  
  variants:
    control:
      name: "标准PRD生成"
      model: "qwen-max"
      prompt_template: "01_PRD_标准"
      weight: 0.5
      
    treatment:
      name: "JSON模式PRD"
      model: "qwen-max"
      prompt_template: "01_PRD_JSON_Schema"
      weight: 0.5
  
  evaluation:
    primary_metric: "prd_completeness_score"
    secondary_metrics: ["schema_compliance_rate", "constraint_coverage", "acceptance_measurability"]
    evaluation_method: "llm_as_judge"
    sample_size: 80
    confidence_level: 0.95
```

### AB-02-01: Kimi长文档 vs 分段架构评审

```yaml
ab_test_config:
  test_id: "AB-02-01"
  test_name: "Kimi长文档全量注入 vs 分段架构评审"
  description: "验证Kimi 200K上下文全量注入vs分段注入的架构评审质量"
  
  variants:
    control:
      name: "分段架构评审"
      model: "qwen-max"
      prompt_template: "02_架构评审_分段"
      weight: 0.5
      
    treatment:
      name: "长文档全量注入"
      model: "kimi"
      prompt_template: "02_架构评审_长文档"
      weight: 0.5
  
  evaluation:
    primary_metric: "cross_module_issue_detection"
    secondary_metrics: ["consistency_gap_detection", "depth_of_analysis"]
    evaluation_method: "llm_as_judge"
    sample_size: 50
    confidence_level: 0.95
```

### AB-08-01: ERNIE合规增强 vs 标准安全审计

```yaml
ab_test_config:
  test_id: "AB-08-01"
  test_name: "ERNIE-4.0合规增强 vs 标准安全审计"
  description: "验证ERNIE合规增强指令对安全审计的合规覆盖提升"
  
  variants:
    control:
      name: "标准安全审计"
      model: "deepseek-v3"
      prompt_template: "08_安全审计_标准"
      weight: 0.5
      
    treatment:
      name: "合规增强审计"
      model: "ernie-4.0"
      prompt_template: "08_安全审计_合规增强"
      weight: 0.5
  
  evaluation:
    primary_metric: "compliance_gap_detection_rate"
    secondary_metrics: ["regulation_coverage", "remediation_actionability"]
    sample_size: 60
    confidence_level: 0.95
```

### AB-PERF-01: 执行耗时优化

```yaml
ab_test_config:
  test_id: "AB-PERF-01"
  test_name: "Prompt Caching优化效果验证"
  description: "验证Prompt Caching对高频调用场景的耗时优化"
  
  variants:
    control:
      name: "无缓存"
      weight: 0.5
      
    treatment:
      name: "Prompt Caching"
      weight: 0.5
  
  evaluation:
    primary_metric: "avg_response_time_ms"
    secondary_metrics: ["cache_hit_rate", "output_quality_retention"]
    sample_size: 200
    confidence_level: 0.95
```

