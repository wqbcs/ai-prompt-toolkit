## 一、A/B测试配置模板

```yaml
ab_test_config:
  test_id: "AB-{场景ID}-{序号}"
  test_name: ""
  description: ""
  created_at: "2026-05-29"
  status: "draft"  # draft/running/completed
  
  variants:
    control:
      name: "原始版本"
      prompt_version: "v4.6.0"
      model: ""
      prompt_template: ""
      weight: 0.5
      
    treatment:
      name: "优化版本"
      prompt_version: "v4.7.0"
      model: ""
      prompt_template: ""
      weight: 0.5
  
  evaluation:
    primary_metric: ""  # 如: output_quality_score
    secondary_metrics: []
    evaluation_method: "llm_as_judge"  # llm_as_judge / human / automated
    judge_model: "gpt-4"
    judge_prompt_template: ""
    sample_size: 100
    confidence_level: 0.95
    
  stopping_criteria:
    min_samples: 50
    max_samples: 200
    min_effect_size: 0.05
    early_stopping: true
    
  metadata:
    hypothesis: ""
    expected_improvement: ""
    risk_level: "low"  # low/medium/high
```

