### 基本信息
- 测试名称：{test_name}
- 执行日期：{date}
- 样本量：Control={n1}, Treatment={n2}

### 主要指标
| 指标 | Control均值 | Treatment均值 | 差异 | p值 | 显著性 |
|------|-----------|-------------|------|-----|--------|
| {primary_metric} | {c_mean} | {t_mean} | {diff} | {p} | {sig} |

### 结论
- 统计显著：{is_significant}
- 效果量：{effect_size}
- 建议：{recommendation}
```

