version: "3.8"

services:
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./prompts:/app/prompts
    command: ["lint", "-t", "/app/prompts"]

  playground:
    build:
      context: .
      dockerfile: Dockerfile
      target: playground
    ports:
      - "8080:8080"
    volumes:
      - ./prompts:/app/prompts
    environment:
      - PROMPT_CLI_COST_LIMIT=5.0

  market:
    build:
      context: .
      dockerfile: Dockerfile
      target: playground
    ports:
      - "8081:8080"
    volumes:
      - market-data:/root/.ai-prompt-toolkit
    command: ["uvicorn", "ai_prompt_toolkit.playground.server:app", "--host", "0.0.0.0", "--port", "8080"]

volumes:
  market-data:
