repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, types-jsonschema]
        args: [--ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: local
    hooks:
      - id: prompt-lint
        name: Prompt Lint
        entry: prompt-cli lint -t
        language: system
        files: '\.prompt\.md$|\.prompt$'
        pass_filenames: true

      - id: prompt-scan
        name: Prompt Security Scan
        entry: prompt-cli scan -t
        language: system
        files: '\.prompt\.md$|\.prompt$'
        pass_filenames: true

      - id: version-badge-drift
        name: Version Badge Drift Check (R212)
        # 根治版本号/徽章口径漂移复发: README Version徽章必须==__version__,
        # pyproject.toml version必须==__version__ (R194/R207-6修过两次, 靠人记必复发)
        entry: python scripts/check_version_consistency.py
        language: system
        files: 'README\.md|pyproject\.toml|src/ai_prompt_toolkit/__init__\.py|CHANGELOG\.md'
        pass_filenames: false

      - id: pytest-smoke
        name: Pytest Smoke Test
        entry: python -m pytest tests/ -x -q --tb=line -k "not slow"
        language: system
        pass_filenames: false
        stages: [push]
